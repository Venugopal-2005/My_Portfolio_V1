version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: portfolio_postgres
    restart: always
    environment:
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: portfolio_password
      POSTGRES_DB: portfolio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio_user -d portfolio_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://portfolio_user:portfolio_password@db:5432/portfolio_db
      - ENVIRONMENT=production
      - PROJECT_NAME=Venugopal K | Python Full-Stack & AI/ML Portfolio API
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./my certificates and achievements:/app/my certificates and achievements:ro
      - ./RESUME.pdf:/app/RESUME.pdf:ro
      - ./images:/app/images:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portfolio_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
